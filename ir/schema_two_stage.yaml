schema_version: '2.1'
design_name: two_stage_ota

topology:
  architecture: two-stage

targets:
  dc_gain:              {min: 60, unit: dB, priority: 1}
  unity_gain_bandwidth: {min: 500000000, unit: Hz, priority: 1}
  phase_margin:         {min: 60, unit: deg, priority: 1}
  power:                {max: 5.0e-04, unit: W, priority: 2}

design_variables:
  - {device: M1, variable: gm_id, range: {min: 10, max: 22}, initial: 16, symmetry_label: sym_M1_M2}
  - {device: M1, variable: L,     range: {min: 3.0e-07, max: 2.0e-06}, initial: 1.0e-06, symmetry_label: sym_M1_M2}
  - {device: M2, variable: gm_id, range: {min: 10, max: 22}, initial: 16, symmetry_label: sym_M1_M2}
  - {device: M2, variable: L,     range: {min: 3.0e-07, max: 2.0e-06}, initial: 1.0e-06, symmetry_label: sym_M1_M2}
  - {device: M3, variable: gm_id, range: {min: 5, max: 12}, initial: 7, symmetry_label: sym_load_M3_M4}
  - {device: M3, variable: L,     range: {min: 3.0e-07, max: 2.0e-06}, initial: 1.0e-06, symmetry_label: sym_load_M3_M4}
  - {device: M4, variable: gm_id, range: {min: 5, max: 12}, initial: 7, symmetry_label: sym_load_M3_M4}
  - {device: M4, variable: L,     range: {min: 3.0e-07, max: 2.0e-06}, initial: 1.0e-06, symmetry_label: sym_load_M3_M4}
  - {device: M5, variable: gm_id, range: {min: 6, max: 14}, initial: 9}
  - {device: M5, variable: L,     range: {min: 2.0e-07, max: 1.5e-06}, initial: 5.0e-07}
  - {device: M6, variable: gm_id, range: {min: 6, max: 18}, initial: 10}
  - {device: M6, variable: L,     range: {min: 2.0e-07, max: 2.0e-06}, initial: 8.0e-07}
  - {device: M7, variable: gm_id, range: {min: 6, max: 14}, initial: 9}
  - {device: M7, variable: L,     range: {min: 2.0e-07, max: 1.5e-06}, initial: 5.0e-07}
  - {device: "", variable: I_tail,   range: {min: 5.0e-06, max: 8.0e-05}, initial: 2.0e-05, unit: A}
  - {device: "", variable: I_stage2, range: {min: 1.0e-05, max: 2.5e-04}, initial: 8.0e-05, unit: A}
  - {device: "", variable: Cc,       range: {min: 1.0e-13, max: 2.5e-12}, initial: 4.0e-13, unit: F}
  - {device: "", variable: Rz,       range: {min: 1.0e+02, max: 2.0e+04}, initial: 1.0e+03, unit: ohm}

corrections:
  gm_factor: 0.85
  gds_factor: 1.0
  c_factor: 1.15
  description: "Conservative two-stage estimator; ngspice remains final authority"

constraints:
  gm_id: {min: 5, max: 25}
  L: {min: 1.3e-07, max: 2.0e-06}
  devices:
    M1: {gm_id: {min: 10, max: 22}, L: {min: 3.0e-07, max: 2.0e-06}}
    M2: {gm_id: {min: 10, max: 22}, L: {min: 3.0e-07, max: 2.0e-06}}
    M3: {gm_id: {min: 5, max: 12},  L: {min: 3.0e-07, max: 2.0e-06}}
    M4: {gm_id: {min: 5, max: 12},  L: {min: 3.0e-07, max: 2.0e-06}}
    M5: {gm_id: {min: 6, max: 14},  L: {min: 2.0e-07, max: 1.5e-06}}
    M6: {gm_id: {min: 6, max: 18},  L: {min: 2.0e-07, max: 2.0e-06}}
    M7: {gm_id: {min: 6, max: 14},  L: {min: 2.0e-07, max: 1.5e-06}}

loss_terms:
  - {id: gain_deficit, formula: "relu(targets.dc_gain.min - realized.dc_gain)/max(targets.dc_gain.min, 1)", weight: 4.0}
  - {id: bw_deficit,   formula: "relu(targets.unity_gain_bandwidth.min - realized.unity_gain_bandwidth)/max(targets.unity_gain_bandwidth.min, 1)", weight: 3.0}
  - {id: pm_deficit,   formula: "relu(targets.phase_margin.min - realized.phase_margin)/max(targets.phase_margin.min, 1)", weight: 7.0}
  - {id: power_ratio,  formula: "realized.power/max(targets.power.max, 1e-9)", weight: 0.4}
  - {id: zero_alignment, formula: "abs(realized.Rz - realized.zero_target_rz)/max(realized.zero_target_rz, 1)", weight: 0.08}

evaluations:
  - {name: dc_gain, type: ac_gain, probe: vout, target_ref: dc_gain}
  - {name: unity_gain_bandwidth, type: ugbw, probe: vout, target_ref: unity_gain_bandwidth}
  - {name: phase_margin, type: phase_margin, probe: vout, target_ref: phase_margin}
  - {name: total_power, type: dc_power, target_ref: power}
