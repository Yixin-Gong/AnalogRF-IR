schema_version: '0.1'
design_name: current_mirror_ota_ihp130

metadata:
  process_hint: IHP_SG13G2_130nm
  topology_family: current_mirror_ota
  note: "Single-stage current-mirror OTA baseline for IHP SG13G2 130 nm with development-grade targets calibrated against ngspice."

global_parameters:
  vbias: 0.52

topology:
  name: current_mirror_ota_ihp130
  class: ota
  architecture: current-mirror
  global_nets:
    - {name: vdd, type: supply}
    - {name: gnd, type: ground}
  ports:
    - {id: vinp, direction: input}
    - {id: vinn, direction: input}
    - {id: vout, direction: output}
    - {id: vbias, direction: bias}
  devices:
    - {id: M1, role: input_pair, stage: input, type: nmos, connections: {drain: nmir, gate: vinn, source: tail, body: gnd}}
    - {id: M2, role: input_pair, stage: input, type: nmos, connections: {drain: vout, gate: vinp, source: tail, body: gnd}}
    - {id: M3, role: current_mirror_load, stage: load, type: pmos, connections: {drain: nmir, gate: nmir, source: vdd, body: vdd}}
    - {id: M4, role: current_mirror_load, stage: load, type: pmos, connections: {drain: vout, gate: nmir, source: vdd, body: vdd}}
    - {id: M5, role: tail_current_source, stage: bias, type: nmos, connections: {drain: tail, gate: vbias, source: gnd, body: gnd}}

targets:
  dc_gain:              {min: 24, unit: dB, priority: 1}
  unity_gain_bandwidth: {min: 5.0e+06, unit: Hz, priority: 1}
  phase_margin:         {min: 45, unit: deg, priority: 1}
  slew_rate:            {min: 4.0e+06, unit: V/s, priority: 2}
  output_swing:         {min: 4.0e-01, unit: V, priority: 1}
  power:                {max: 4.0e-04, unit: W, priority: 2}

design_variables:
  - {device: M1, variable: gm_id, range: {min: 10, max: 24}, initial: 16, symmetry_label: sym_M1_M2}
  - {device: M1, variable: L,     range: {min: 1.3e-07, max: 2.0e-06}, initial: 4.0e-07, symmetry_label: sym_M1_M2}
  - {device: M2, variable: gm_id, range: {min: 10, max: 24}, initial: 16, symmetry_label: sym_M1_M2}
  - {device: M2, variable: L,     range: {min: 1.3e-07, max: 2.0e-06}, initial: 4.0e-07, symmetry_label: sym_M1_M2}
  - {device: M3, variable: gm_id, range: {min: 5, max: 14}, initial: 8, symmetry_label: sym_load_M3_M4}
  - {device: M3, variable: L,     range: {min: 1.3e-07, max: 2.0e-06}, initial: 6.0e-07, symmetry_label: sym_load_M3_M4}
  - {device: M4, variable: gm_id, range: {min: 5, max: 14}, initial: 8, symmetry_label: sym_load_M3_M4}
  - {device: M4, variable: L,     range: {min: 1.3e-07, max: 2.0e-06}, initial: 6.0e-07, symmetry_label: sym_load_M3_M4}
  - {device: M5, variable: gm_id, range: {min: 5, max: 12}, initial: 8}
  - {device: M5, variable: L,     range: {min: 1.3e-07, max: 1.5e-06}, initial: 4.0e-07}
  - {device: "", variable: I_tail, range: {min: 2.0e-06, max: 1.5e-04}, initial: 2.5e-05, unit: A}
  - {device: "", variable: vbias, range: {min: 0.30, max: 0.80}, initial: 0.52, unit: V}

corrections:
  gm_factor: 0.80
  gds_factor: 0.82
  c_factor: 1.05
  description: "IHP130 current-mirror OTA compact model; ngspice remains final authority."

constraints:
  gm_id: {min: 5, max: 25}
  L: {min: 1.3e-07, max: 2.0e-06}
  global:
    vbias: {min: 0.30, max: 0.80}
  devices:
    M1: {gm_id: {min: 10, max: 24}, L: {min: 1.3e-07, max: 2.0e-06}}
    M2: {gm_id: {min: 10, max: 24}, L: {min: 1.3e-07, max: 2.0e-06}}
    M3: {gm_id: {min: 5, max: 14}, L: {min: 1.3e-07, max: 2.0e-06}}
    M4: {gm_id: {min: 5, max: 14}, L: {min: 1.3e-07, max: 2.0e-06}}
    M5: {gm_id: {min: 5, max: 12}, L: {min: 1.3e-07, max: 1.5e-06}}

loss_terms:
  - {id: gain_deficit, formula: "relu(targets.dc_gain.min - realized.dc_gain)/max(targets.dc_gain.min, 1)", weight: 8.0}
  - {id: bw_deficit, formula: "relu(targets.unity_gain_bandwidth.min - realized.unity_gain_bandwidth)/max(targets.unity_gain_bandwidth.min, 1)", weight: 5.0}
  - {id: pm_deficit, formula: "relu(targets.phase_margin.min - realized.phase_margin)/max(targets.phase_margin.min, 1)", weight: 4.0}
  - {id: sr_deficit, formula: "relu(targets.slew_rate.min - realized.slew_rate)/max(targets.slew_rate.min, 1)", weight: 1.0}
  - {id: swing_deficit, formula: "relu(targets.output_swing.min - realized.output_swing)/max(targets.output_swing.min, 1)", weight: 2.0}
  - {id: power_ratio, formula: "realized.power/max(targets.power.max, 1e-9)", weight: 0.2}

evaluations:
  - {name: dc_gain, type: ac_gain, probe: vout, target_ref: dc_gain}
  - {name: unity_gain_bandwidth, type: ugbw, probe: vout, target_ref: unity_gain_bandwidth}
  - {name: phase_margin, type: phase_margin, probe: vout, target_ref: phase_margin}
  - {name: slew_rate, type: slew_rate, probe: vout, target_ref: slew_rate}
  - {name: output_swing, type: output_swing, probe: vout, target_ref: output_swing}
  - {name: total_power, type: dc_power, target_ref: power}
