schema_version: '0.1'
design_name: telescopic_ota_ihp130_frontier_stress
metadata:
  process_hint: IHP_SG13G2_130nm
  topology_family: telescopic_cascode_ota
  note: Low-voltage telescopic cascode OTA stress case for IHP SG13G2 130 nm with
    explicit NMOS and PMOS cascode bias voltages.
  stress_profile:
    name: frontier_stress
    source_manifest: runs/ablations_ihp130_ota_llm_full_residual_escape_compact_reverse_20260611/manifest.json
    source_case: llm_full_residual_escape_postprocess_fallback
    rule: PM fixed at 60 deg; gain/UGB/SR/swing/saturation use non-power Pareto p35
      with guard bands; power is excluded from the stress objective
global_parameters:
  vbias_tail: 0.5
  vbias_ncas: 0.72
  vbias_pcas: 0.55
topology:
  name: telescopic_ota_ihp130
  class: ota
  architecture: telescopic-cascode
  global_nets:
  - name: vdd
    type: supply
  - name: gnd
    type: ground
  ports:
  - id: vinp
    direction: input
  - id: vinn
    direction: input
  - id: vout
    direction: output
  - id: vbias_tail
    direction: bias
  - id: vbias_ncas
    direction: bias
  - id: vbias_pcas
    direction: bias
  devices:
  - id: M1
    role: input_pair
    stage: input
    type: nmos
    connections:
      drain: nd1
      gate: vinn
      source: tail
      body: gnd
  - id: M2
    role: input_pair
    stage: input
    type: nmos
    connections:
      drain: nd2
      gate: vinp
      source: tail
      body: gnd
  - id: M5
    role: tail_current_source
    stage: bias
    type: nmos
    connections:
      drain: tail
      gate: vbias_tail
      source: gnd
      body: gnd
  - id: M6
    role: input_cascode
    stage: cascode
    type: nmos
    connections:
      drain: outn
      gate: vbias_ncas
      source: nd1
      body: gnd
  - id: M7
    role: input_cascode
    stage: cascode
    type: nmos
    connections:
      drain: vout
      gate: vbias_ncas
      source: nd2
      body: gnd
  - id: M3
    role: current_mirror_load
    stage: load
    type: pmos
    connections:
      drain: pcas_ref
      gate: pcas_ref
      source: vdd
      body: vdd
  - id: M4
    role: current_mirror_load
    stage: load
    type: pmos
    connections:
      drain: pcas_out
      gate: pcas_ref
      source: vdd
      body: vdd
  - id: M8
    role: load_cascode
    stage: cascode
    type: pmos
    connections:
      drain: outn
      gate: vbias_pcas
      source: pcas_ref
      body: vdd
  - id: M9
    role: load_cascode
    stage: cascode
    type: pmos
    connections:
      drain: vout
      gate: vbias_pcas
      source: pcas_out
      body: vdd
targets:
  dc_gain:
    min: 48.35
    unit: dB
    priority: 1
  unity_gain_bandwidth:
    min: 12390000.0
    unit: Hz
    priority: 1
  phase_margin:
    min: 60.0
    unit: deg
    priority: 1
  slew_rate:
    min: 5700000.0
    unit: V/s
    priority: 2
  output_swing:
    min: 0.9386
    unit: V
    priority: 1
  saturation_margin:
    min: 0.007408
    unit: V
    priority: 3
  power:
    max: 0.0003
    unit: W
    priority: 9
