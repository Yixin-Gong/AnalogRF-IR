loss_terms:
- id: gain_deficit
  formula: relu(targets.dc_gain.min - realized.dc_gain)/max(targets.dc_gain.min, 1)
  weight: 8.0
- id: bw_deficit
  formula: relu(targets.unity_gain_bandwidth.min - realized.unity_gain_bandwidth)/max(targets.unity_gain_bandwidth.min,
    1)
  weight: 13.0
- id: pm_window
  formula: pm_window_penalty(realized.phase_margin, targets.phase_margin.min)
  weight: 2.5
- id: sr_deficit
  formula: relu(targets.slew_rate.min - realized.slew_rate)/max(targets.slew_rate.min,
    1)
  weight: 5.0
- id: swing_deficit
  formula: relu(targets.output_swing.min - realized.output_swing)/max(targets.output_swing.min,
    1)
  weight: 5.0
- id: saturation_margin_deficit
  formula: relu(targets.saturation_margin.min - realized.saturation_margin)/max(targets.saturation_margin.min,
    1e-3)
  weight: 40.0
evaluations:
- name: dc_gain
  type: ac_gain
  probe: vout
  target_ref: dc_gain
- name: unity_gain_bandwidth
  type: ugbw
  probe: vout
  target_ref: unity_gain_bandwidth
- name: phase_margin
  type: phase_margin
  probe: vout
  target_ref: phase_margin
- name: slew_rate
  type: slew_rate
  probe: vout
  target_ref: slew_rate
- name: output_swing
  type: output_swing
  probe: vout
  target_ref: output_swing
- name: saturation_margin
  type: operating_point_margin
  target_ref: saturation_margin
- name: total_power
  type: dc_power
  target_ref: power
