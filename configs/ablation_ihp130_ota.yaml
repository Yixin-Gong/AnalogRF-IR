schema_version: analogrf_ir.ablation_config.v0_1
description: IHP SG13G2 130 nm OTA topology-family ablation matrix.

base_config: configs/default.yaml
output_dir: runs/ablations_ihp130_ota
schemas:
  - inputs/ota/two_stage_miller/two_stage_miller_ota.yaml
  - inputs/ota/current_mirror/current_mirror_ota_ihp130.yaml
  - inputs/ota/telescopic/telescopic_ota_ihp130.yaml
  - inputs/ota/folded_cascode/folded_cascode_ota_ihp130.yaml
  - inputs/ota/five_transistor/five_transistor_ota.yaml
seeds: [1, 2, 3]

base_overrides:
  input:
    env: environment_ihp_sg13g2.yaml
    topology: yaml
  optimizer:
    generations: 50
    pop_size: 100
  reoptimization:
    generations: 3
    pop_size: 24
  llm:
    model: deepseek-v4-flash
    thinking: disabled
    temperature: 0.0
  intervention:
    max_actions: 8
  actions:
    strategy: combo_coarse_fine

cases:
  - name: optimizer_only
    family: baseline
    description: IHP130 topology optimizer only; no diagnosis, intervention model, LLM planning, or postprocess repair.
    overrides:
      agent:
        rounds: 1
      intervention:
        enable: false
      postprocess:
        policy: 'off'

  - name: optimizer_postprocess_fallback
    family: postprocess_control
    description: IHP130 optimizer plus topology-specific fallback postprocess when near-feasible or stagnated.
    overrides:
      agent:
        rounds: 1
      intervention:
        enable: false
      postprocess:
        policy: 'fallback'

  - name: diagnosis_spice_postprocess_fallback
    family: diagnosis_control
    description: Deterministic diagnosis-guided rounds with constrained local intervention evidence and fallback postprocess, but without LLM planning; runs up to 20 rounds when specs remain unsatisfied.
    overrides:
      agent:
        rounds: 20
      llm:
        provider: deterministic
      intervention:
        enable: true
        max_actions: 8
      postprocess:
        policy: 'fallback'

  - name: llm_diagnosis_postprocess_fallback
    family: combined_method
    description: Full LLM diagnosis flow with constrained local intervention evidence and topology-specific fallback repair for IHP130 OTA families; runs up to 20 rounds when specs remain unsatisfied.
    overrides:
      agent:
        rounds: 20
      llm:
        provider: deepseek
      intervention:
        enable: true
        max_actions: 8
      postprocess:
        policy: 'fallback'
